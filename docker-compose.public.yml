# Mentalist on ONE small public server, with HTTPS.
# Step-by-step guide: deploy/PUBLIC_SERVER.md
#
#   ./deploy/public/make-env.sh                         # once: creates .env with your domain, key and fresh secrets
#   docker compose -f docker-compose.public.yml up -d --build
#
# Only Caddy is reachable from the internet (ports 80/443). It gets a free
# Let's Encrypt certificate for DOMAIN and forwards to the frontend's nginx,
# which serves the Angular app and proxies /api to the backend. The backend,
# database, Redis, queue and Ollama stay on Docker's private network.
name: mentalist-public

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env (run deploy/public/make-env.sh)}
    volumes:
      - ./deploy/public/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    volumes:
      # Same image as docker-compose.prod.yml, with a config that keeps
      # /actuator private and passes Caddy's client address through.
      - ./deploy/public/nginx-public.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      localstack:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      # Chat answers via Gemini; report analysis uses GEMINI_API_KEY directly.
      SPRING_PROFILES_ACTIVE: gemini
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mentalist
      SPRING_DATASOURCE_USERNAME: mentalist
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AWS_SQS_ENDPOINT: http://localstack:4566
      OLLAMA_BASE_URL: http://ollama:11434
      STORAGE_DIR: /data/uploads
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      # Public server: people sign up, see only their own reports plus your
      # samples, and get a daily allowance of AI calls (you, the admin, don't).
      PUBLIC_MODE: "true"
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      MAX_USERS: ${MAX_USERS:-1000}
      TRUST_FORWARDED_FOR: "true"
      LIMIT_ANALYSES_PER_USER_PER_DAY: ${LIMIT_ANALYSES_PER_USER_PER_DAY:-3}
      LIMIT_QUESTIONS_PER_USER_PER_DAY: ${LIMIT_QUESTIONS_PER_USER_PER_DAY:-30}
      LIMIT_ANALYSES_PER_DAY: ${LIMIT_ANALYSES_PER_DAY:-60}
      LIMIT_QUESTIONS_PER_DAY: ${LIMIT_QUESTIONS_PER_DAY:-900}
      REPORTS_ANALYSIS_THREADS: "2"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
      LOGGING_LEVEL_COM_HRRAGASSISTANT_BACKEND: info
    volumes:
      - uploads:/data/uploads
    mem_limit: 2g

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: mentalist
      POSTGRES_USER: mentalist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentalist -d mentalist"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redisdata:/data

  # The ingestion queue. Pinned to the 3.x community image, which runs without
  # a LocalStack account (newer LocalStack releases require one).
  localstack:
    image: localstack/localstack:3
    restart: unless-stopped
    environment:
      SERVICES: sqs
      DEFAULT_REGION: us-east-1
    volumes:
      - localstackdata:/var/lib/localstack

  # Embeddings for report chat (nomic-embed-text, small and CPU-friendly).
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollamadata:/root/.ollama

  # One-off: downloads the embedding model into the ollama volume, then exits.
  ollama-pull:
    image: ollama/ollama
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 5 && ollama pull nomic-embed-text"]
    restart: "no"

volumes:
  caddy_data:
  caddy_config:
  uploads:
  pgdata:
  redisdata:
  localstackdata:
  ollamadata:
