# nginx inside the frontend container, for docker-compose.public.yml.
# Differences from frontend/nginx.conf: /actuator is not exposed, and the
# client address from Caddy is passed through unchanged for rate limiting.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        client_max_body_size 80m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Metrics stay private on the public server.
    location /actuator/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
