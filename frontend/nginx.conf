# For the docker-compose.prod.yml all-in-one option: `backend` resolves via
# Docker's internal DNS to the backend service in that compose file. The
# real AWS target (see deploy/DEPLOYMENT.md) uses CloudFront path-based
# routing instead of this proxy layer.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Annual reports can be well over 100 MB; nginx's default limit is 1 MB.
        client_max_body_size 300m;
        # Stream uploads to the backend instead of buffering them here first.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
