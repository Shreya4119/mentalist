<div class="login-page">
  <form class="login-card" (ngSubmit)="submit()">
    <h1>Mentalist</h1>
    <p class="subtitle">Your AI mentor for reading company reports and learning to invest. Sign in to analyse a report.</p>

    <label>
      Username
      <input
        type="text"
        name="username"
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
        required
        autofocus
      />
    </label>

    <label>
      Password
      <input
        type="password"
        name="password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        required
      />
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="loading() || !username().trim() || !password()">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>

    <p class="hint">Demo accounts: <code>admin / admin-pass</code> · <code>demo / demo-pass</code></p>
  </form>
</div>
