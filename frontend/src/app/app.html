@if (auth.isAuthenticated()) {
  <nav class="topbar">
    <span class="brand">Mentalist</span>
    <div class="nav-links">
      <a routerLink="/reports" [class.active]="onReports()" [attr.aria-current]="onReports() ? 'page' : null">Financial reports</a>
      <a routerLink="/plan" routerLinkActive="active" ariaCurrentWhenActive="page">My plan</a>
      <a routerLink="/reports/learn" routerLinkActive="active" ariaCurrentWhenActive="page">Learn</a>
    </div>
    <div class="user">
      <div class="theme-picker">
        <button
          type="button"
          class="theme-toggle"
          [style.background]="'var(--color-primary)'"
          (click)="toggleThemePicker()"
          title="Change color theme"
          aria-label="Change color theme"
          [attr.aria-expanded]="themePickerOpen()"
        ></button>

        @if (themePickerOpen()) {
          <div class="theme-menu">
            @for (option of themeOptions; track option.id) {
              <button
                type="button"
                class="theme-option"
                [class.active]="themeService.theme() === option.id"
                (click)="selectTheme(option.id)"
              >
                <span class="swatch" [style.background]="option.swatch"></span>
                {{ option.name }}
              </button>
            }
          </div>
        }
      </div>

      <span class="user-name">{{ auth.displayName() }}</span>
      <button type="button" (click)="logout()">Log out</button>
    </div>
  </nav>
}

<router-outlet />

@if (auth.isAuthenticated()) {
  <footer class="app-footer">
    <span>Educational tool, not financial advice.</span>
    <a routerLink="/about">About &amp; privacy</a>
    <a routerLink="/account">Your account</a>
  </footer>
}
