services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hrrag
      POSTGRES_USER: hrrag
      POSTGRES_PASSWORD: hrrag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstackdata:/var/lib/localstack

volumes:
  pgdata:
  redisdata:
  localstackdata:
