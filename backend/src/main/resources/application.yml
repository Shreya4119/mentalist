spring:
  application:
    name: mentalist-backend

  # Local secrets (API keys) live in backend/.env, which is git-ignored.
  # Optional: the app starts fine without it.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/hrrag
    username: hrrag
    password: hrrag

  jpa:
    hibernate:
      ddl-auto: update

  docker:
    compose:
      file: ../docker-compose.yml
      lifecycle-management: start-and-stop

  servlet:
    multipart:
      # Annual reports full of photos can exceed 100 MB. Uploads are streamed to
      # disk (above 2 MB) and then shrunk per AI provider before analysis.
      max-file-size: ${REPORTS_MAX_UPLOAD_MB:250}MB
      max-request-size: ${REPORTS_MAX_REQUEST_MB:300}MB
      file-size-threshold: 2MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  ai:
    # Which provider backs each model type. Chat defaults to local Ollama;
    # the "gemini" and "groq" profiles switch it to the OpenAI-compatible
    # client. Embeddings always stay on Ollama (nomic-embed-text, 768 dims) --
    # changing the embedding model would change the vector size and force a
    # full re-index. The OpenAI starter's other model types are switched off
    # so it never asks for an API key it doesn't need.
    model:
      chat: ollama
      embedding: ollama
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:llama3.2}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: hnsw
        distance-type: cosine_distance

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-1234567890abcdef1234567890abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  aws:
    sqs:
      endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}
      region: ${AWS_REGION:us-east-1}
      queue-name: ${AWS_SQS_QUEUE_NAME:document-ingestion}
  observability:
    cost-per-1k-tokens-usd: ${COST_PER_1K_TOKENS_USD:0.003}
  # Public server (deploy/PUBLIC_SERVER.md). All off locally: no sign-up page,
  # no daily caps. On the public server people create accounts, each sees only
  # their own reports plus the admin's shared sample reports, and AI calls are
  # capped per person and for the whole site each day (0 = unlimited).
  hosting:
    public-mode: ${PUBLIC_MODE:false}
    signup-enabled: ${SIGNUP_ENABLED:false}
    max-users: ${MAX_USERS:1000}
    signups-per-hour: ${SIGNUPS_PER_IP_PER_HOUR:5}
  limits:
    analyses-per-user-per-day: ${LIMIT_ANALYSES_PER_USER_PER_DAY:0}
    analyses-per-day: ${LIMIT_ANALYSES_PER_DAY:0}
    questions-per-user-per-day: ${LIMIT_QUESTIONS_PER_USER_PER_DAY:0}
    questions-per-day: ${LIMIT_QUESTIONS_PER_DAY:0}
    zone: ${LIMIT_ZONE:Europe/Amsterdam}
  seed:
    admin-password: ${ADMIN_PASSWORD:admin-pass}
    demo-password: ${DEMO_PASSWORD:demo-pass}
  security:
    # Only behind the public deployment's proxies, which set X-Forwarded-For.
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
    max-failed-logins: ${MAX_FAILED_LOGINS:10}
    failed-login-window-minutes: 15
  # Uploaded report files live here, not in Postgres (relative to where the backend starts).
  storage:
    dir: ${STORAGE_DIR:./data/uploads}
  # AI fundamental analysis of financial reports. Both providers read PDFs
  # natively (tables, charts, scanned pages). A provider without an API key is
  # shown as unavailable in the UI. Keys go in backend/.env.
  reports:
    max-upload-mb: ${REPORTS_MAX_UPLOAD_MB:250}
    # Analyses running at once; each holds one (already shrunk) report in memory.
    analysis-threads: ${REPORTS_ANALYSIS_THREADS:2}
    default-provider: ${REPORTS_DEFAULT_PROVIDER:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${REPORTS_GEMINI_MODEL:gemini-3.8-flash}
    claude:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${REPORTS_CLAUDE_MODEL:claude-sonnet-5-5}
      max-tokens: ${REPORTS_CLAUDE_MAX_TOKENS:16000}

server:
  tomcat:
    # Read the rest of an over-limit upload so the browser gets the 413 message
    # instead of a dropped connection.
    max-swallow-size: -1

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

logging:
  level:
    com.hrragassistant.backend: debug
