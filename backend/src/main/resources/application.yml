spring:
  application:
    name: hr-rag-assistant-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/hrrag
    username: hrrag
    password: hrrag

  jpa:
    hibernate:
      ddl-auto: update

  docker:
    compose:
      file: ../docker-compose.yml
      lifecycle-management: start-and-stop

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:llama3.2}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: hnsw
        distance-type: cosine_distance

logging:
  level:
    com.hrragassistant.backend: debug
