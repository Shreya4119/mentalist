spring:
  application:
    name: hr-rag-assistant-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/hrrag
    username: hrrag
    password: hrrag

  jpa:
    hibernate:
      ddl-auto: update

  docker:
    compose:
      file: ../docker-compose.yml
      lifecycle-management: start-and-stop

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:llama3.2}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: hnsw
        distance-type: cosine_distance

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-1234567890abcdef1234567890abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  aws:
    sqs:
      endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}
      region: ${AWS_REGION:us-east-1}
      queue-name: ${AWS_SQS_QUEUE_NAME:document-ingestion}
  observability:
    cost-per-1k-tokens-usd: ${COST_PER_1K_TOKENS_USD:0.003}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

logging:
  level:
    com.hrragassistant.backend: debug
