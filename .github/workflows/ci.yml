# Unverified in this environment: this repo has no GitHub remote and there's
# no local Actions runner available, so this workflow has never actually
# executed. Written to current action versions (checked against each
# action's real latest release, not assumed) and well-established patterns,
# but review on first real push before trusting it blindly.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile
        working-directory: backend
        run: ./mvnw -B compile

      # Includes the Testcontainers integration test -- ubuntu-latest
      # runners have Docker preinstalled, no extra setup needed.
      - name: Test
        working-directory: backend
        run: ./mvnw -B test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  # Publishes to GHCR (not ECR) deliberately -- ECR would need AWS
  # credentials configured as GitHub secrets, which doesn't fit this
  # project's "no AWS account" constraint. GHCR needs zero setup beyond the
  # built-in GITHUB_TOKEN. See deploy/DEPLOYMENT.md for what a real
  # deployment would publish to instead.
  publish-images:
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backend:latest
            ghcr.io/${{ github.repository }}-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:latest
            ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
